# Lint lives here so ruff finds one config: pyproject.toml, not ruff.toml.
[tool.ruff]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "N", "UP", "B", "C4",
  "SIM", "RUF", "PERF", "PIE", "RET", "RSE",
  "ARG", "PTH", "FLY", "PL", "TRY", "T20", "T10",
]
ignore = [
  "E501",
  "COM812", "COM819", "ISC001",
  "S101",
]
